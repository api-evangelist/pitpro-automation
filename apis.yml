description: PitPro Automation is a fleet-maintenance technology company building automated
  tire-service systems that perform full tire changes and rotations on commercial fleet
  vehicles in under fifteen minutes. Targeting Class 2 and smaller vehicles, the company
  serves last-mile delivery, rideshare, utility, telecom, moving, and government fleets
  with in-bay automation, 24/7 monitoring, and field support. Backed by Bloomberg Beta,
  PitPro is a hardware-and-software provider focused on reducing fleet downtime; it currently
  publishes no public API, developer portal, or SDK.
